# Claude of Legends in production: one image, one process, one port.
#
# The container publishes no host port. The only way in is the Caddy instance
# of the km01 stack, reached over the shared `km01_edge` network, so a
# compromise of this public, account-less server cannot reach the database or
# the job queue that sit on the km01 network. The km01 compose file owns
# `km01_edge`: bring that stack up first on a fresh box.
#
#   docker compose up -d --build     start or update the game
#   docker compose logs -f game      follow the server log

services:
  game:
    build: .
    image: claude-of-legends:latest
    container_name: claude_of_legends
    restart: unless-stopped
    environment:
      PORT: "8787"
      DATA_DIR: /app/data
      # Exactly one proxy sits in front (the km01 Caddy), and it overwrites the
      # forwarding headers, so the per-address abuse caps key on the real
      # player and not on the proxy (server/edge.ts).
      TRUST_PROXY: "1"
      # Pages allowed to open a game socket. The client is served by this same
      # process, so the host in the request is always allowed and this could be
      # empty; both public names are spelled out anyway, so a proxy that ever
      # rewrites Host cannot refuse every browser at once.
      ALLOWED_ORIGINS: "https://claudeoflegends.com,https://www.claudeoflegends.com"
      # Where the links in confirmation and reset mails point. Must be the
      # public name, not the container's, or every link is unreachable.
      PUBLIC_URL: "https://claudeoflegends.com"
      # Transactional mail (ADR 0007). Both come from a .env file beside
      # this one, which is gitignored: MAIL_API_KEY is a credential and
      # must never be committed. Without them the process logs links
      # instead of sending them, and says which at boot. Outbound HTTPS
      # only; the container still publishes no port of its own.
      MAIL_API_KEY: "${MAIL_API_KEY:-}"
      MAIL_FROM: "${MAIL_FROM:-}"
      # Optional Discord account linking (ADR 0008), from the same .env
      # file: DISCORD_CLIENT_SECRET is a credential and must never be
      # committed. Without both, linking is off, the client never offers
      # it, and everything else works exactly as before. The redirect
      # follows PUBLIC_URL unless DISCORD_REDIRECT_URI overrides it.
      DISCORD_CLIENT_ID: "${DISCORD_CLIENT_ID:-}"
      DISCORD_CLIENT_SECRET: "${DISCORD_CLIENT_SECRET:-}"
    volumes:
      # Player identities and the match log. Careers reset without this.
      - game_data:/app/data
    networks:
      - edge
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  game_data:

networks:
  edge:
    name: km01_edge
    external: true
