# Claude of Legends in production: one image, one process, one port.
#
# The container publishes no host port. The only way in is the Caddy instance
# of the km01 stack, reached over the shared `km01_edge` network, so a
# compromise of this public, account-less server cannot reach the database or
# the job queue that sit on the km01 network. The km01 compose file owns
# `km01_edge`: bring that stack up first on a fresh box.
#
#   docker compose up -d --build     start or update the game
#   docker compose logs -f game      follow the server log

services:
  game:
    build: .
    image: claude-of-legends:latest
    container_name: claude_of_legends
    restart: unless-stopped
    environment:
      PORT: "8787"
      DATA_DIR: /app/data
      # Exactly one proxy sits in front (the km01 Caddy), and it overwrites the
      # forwarding headers, so the per-address abuse caps key on the real
      # player and not on the proxy (server/edge.ts).
      TRUST_PROXY: "1"
      # Pages allowed to open a game socket. The client is served by this same
      # process, so the host in the request is always allowed and this could be
      # empty; both public names are spelled out anyway, so a proxy that ever
      # rewrites Host cannot refuse every browser at once.
      ALLOWED_ORIGINS: "https://claudeoflegends.com,https://www.claudeoflegends.com"
      # Where the links in confirmation and reset mails point. Must be the
      # public name, not the container's, or every link is unreachable.
      PUBLIC_URL: "https://claudeoflegends.com"
      # Transactional mail (ADR 0007). Both come from a .env file beside
      # this one, which is gitignored: MAIL_API_KEY is a credential and
      # must never be committed. Without them the process logs links
      # instead of sending them, and says which at boot. Outbound HTTPS
      # only; the container still publishes no port of its own.
      MAIL_API_KEY: "${MAIL_API_KEY:-}"
      MAIL_FROM: "${MAIL_FROM:-}"
      # Optional Discord sign-in (ADR 0009), from the same .env file:
      # DISCORD_CLIENT_SECRET is a credential and must never be
      # committed. Without both, the button never appears and everything
      # else works exactly as before. The redirect follows PUBLIC_URL
      # unless DISCORD_REDIRECT_URI overrides it.
      DISCORD_CLIENT_ID: "${DISCORD_CLIENT_ID:-}"
      DISCORD_CLIENT_SECRET: "${DISCORD_CLIENT_SECRET:-}"
      # Optional auto-join (ADR 0009): both set and a new account is put
      # into the server on the way in, which widens the consent screen.
      # DISCORD_BOT_TOKEN is a credential; the guild id is not.
      DISCORD_BOT_TOKEN: "${DISCORD_BOT_TOKEN:-}"
      DISCORD_GUILD_ID: "${DISCORD_GUILD_ID:-}"
      # Reads back the daily counters (PRIVACY.md). Unset, and /api/pulse
      # is a 404 for everyone; the counting runs either way.
      PULSE_TOKEN: "${PULSE_TOKEN:-}"
      # The Forge's generation provider (ADR 0010), from the same .env
      # file: TRIPO_API_KEY is a credential and must never be committed.
      # Without it, finalize answers "not configured" and everything else
      # works. See .env.example for the Tripo terms caveat before opening
      # the Forge to players.
      TRIPO_API_KEY: "${TRIPO_API_KEY:-}"
      # The image model behind every 2D generation; optional, and the
      # default is a quality choice rather than a deployment one.
      TRIPO_IMAGE_MODEL: "${TRIPO_IMAGE_MODEL:-}"
      # The coach and the kit conversation (ADR 0013), from the same .env
      # file: ANTHROPIC_API_KEY is a credential and must never be
      # committed. Without it, suggestions are off and the server says so
      # at boot; everything else works. BOT_COACH_MODEL is optional and
      # falls back to the default in .env.example.
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      BOT_COACH_MODEL: "${BOT_COACH_MODEL:-}"
      SUGGEST_MODEL: "${SUGGEST_MODEL:-}"
      # The ledger, the caps, the server's daily ceilings and the meta-API
      # rate limit, all optional. Empty falls back to the defaults listed
      # in .env.example; the server treats an empty string as unset. Every
      # name here is read by server/main.ts, and tests/env_wiring.test.ts
      # fails the build if one of them stops being.
      EMBERS_PER_WEEK: "${EMBERS_PER_WEEK:-}"
      FORGE_DRAFT_CAP: "${FORGE_DRAFT_CAP:-}"
      REPORT_TAKEDOWN_THRESHOLD: "${REPORT_TAKEDOWN_THRESHOLD:-}"
      SERVER_GENERATIONS_PER_DAY: "${SERVER_GENERATIONS_PER_DAY:-}"
      SERVER_ANIMATIONS_PER_DAY: "${SERVER_ANIMATIONS_PER_DAY:-}"
      SERVER_2D_PER_DAY: "${SERVER_2D_PER_DAY:-}"
      SERVER_AGENT_PER_DAY: "${SERVER_AGENT_PER_DAY:-}"
      API_RATE_PER_MIN: "${API_RATE_PER_MIN:-}"
      ART_HISTORY_CAP: "${ART_HISTORY_CAP:-}"
      ASSET_MAX_IMAGE_KB: "${ASSET_MAX_IMAGE_KB:-}"
      ASSET_MAX_MODEL_KB: "${ASSET_MAX_MODEL_KB:-}"
      # Bots on the account (ADR 0013): the two abuse rails, how long an
      # absent owner still gets coached, and the Arena's cadence.
      BOT_CAP: "${BOT_CAP:-}"
      BOT_DEPOSIT_CAP: "${BOT_DEPOSIT_CAP:-}"
      COACH_IDLE_DAYS: "${COACH_IDLE_DAYS:-}"
      ARENA_ROUND_MINUTES: "${ARENA_ROUND_MINUTES:-}"
      ARENA_PLAY_NOW_PER_DAY: "${ARENA_PLAY_NOW_PER_DAY:-}"
      SPARRING_PER_SIDE: "${SPARRING_PER_SIDE:-}"
    volumes:
      # Player identities, the match log, and the Forge store. Careers and
      # forged champions reset without this.
      - game_data:/app/data
    networks:
      - edge
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  game_data:

networks:
  edge:
    name: km01_edge
    external: true
