<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <!-- favicon.ico carries the tab sizes, 16, 32 and 48, so the browser
         picks one rather than downsampling to it (scripts/site_icon.mjs
         cuts the set). Naming it here is belt and braces: a browser asks
         for /favicon.ico on its own anyway, and so do bookmarks and
         history, which never read this markup. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0a1120" />
    <title>Claude of Legends</title>
    <style>
      /* Display face for menu titles; falls back to Georgia. Served from
         here rather than from Google Fonts: a font on someone else's CDN
         hands that company every visitor's address and user agent before
         a single pixel is drawn, which PRIVACY.md promises this site does
         not do. Two subsets of one variable file, 44KB in all, less than
         the round trip it replaces. Cinzel is under the SIL Open Font
         License; see CREDITS.md. */
      @font-face {
        font-family: 'Cinzel';
        font-style: normal;
        font-weight: 400 900;
        font-display: swap;
        src: url('/fonts/cinzel-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA,
          U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
          U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Cinzel';
        font-style: normal;
        font-weight: 400 900;
        font-display: swap;
        src: url('/fonts/cinzel-latin-ext.woff2') format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF,
          U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020,
          U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      html,
      body,
      #app {
        height: 100%;
        margin: 0;
        /* The game itself must never scroll; the landing page is the one
           screen taller than the viewport, and it scrolls inside itself. */
        overflow: hidden;
        background: #0a1120;
      }
      #app {
        position: relative;
      }
      canvas {
        display: block;
        /* The game canvas owns its touch gestures (tap to move, drag to
           pan, pinch to zoom); the browser must not scroll or zoom the
           page from them. Menus and the landing page keep default touch
           behavior so they still scroll. */
        touch-action: none;
      }
      html,
      body {
        overscroll-behavior: none;
      }
      #app {
        -webkit-tap-highlight-color: transparent;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
