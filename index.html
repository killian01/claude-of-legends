<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <link rel="icon" href="data:," />
    <title>Claude of Legends</title>
    <!-- Display face for menu titles; falls back to Georgia offline. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body,
      #app {
        height: 100%;
        margin: 0;
        /* The game itself must never scroll; the landing page is the one
           screen taller than the viewport, and it scrolls inside itself. */
        overflow: hidden;
        background: #0a1120;
      }
      #app {
        position: relative;
      }
      canvas {
        display: block;
        /* The game canvas owns its touch gestures (tap to move, drag to
           pan, pinch to zoom); the browser must not scroll or zoom the
           page from them. Menus and the landing page keep default touch
           behavior so they still scroll. */
        touch-action: none;
      }
      html,
      body {
        overscroll-behavior: none;
      }
      #app {
        -webkit-tap-highlight-color: transparent;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
